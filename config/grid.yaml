# Retrieval grid: 20 configurations
# Naming: <chunk>-<embed>-<retr>-<arch>

parameters:
  bm25_depth: 100
  dense_depth: 100
  rrf_k: 60
  reranker_model: BAAI/bge-reranker-base
  reranker_top_n: 50
  final_top_k: 20

configurations:
  # win64: flat only
  - name: win64-bge-bm25-flat
    chunker: win64
    retrieval: bm25
    architecture: flat
  - name: win64-bge-dense-flat
    chunker: win64
    retrieval: dense
    architecture: flat
  - name: win64-bge-hybrid-flat
    chunker: win64
    retrieval: hybrid
    architecture: flat
  - name: win64-bge-hybridrr-flat
    chunker: win64
    retrieval: hybridrr
    architecture: flat

  # para: flat and linkexp
