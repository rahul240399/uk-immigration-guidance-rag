    chunker: para
    retrieval: bm25
    architecture: flat
  - name: para-bge-dense-flat
    chunker: para
    retrieval: dense
    architecture: flat
  - name: para-bge-hybrid-flat
    chunker: para
    retrieval: hybrid
    architecture: flat
  - name: para-bge-hybridrr-flat
    chunker: para
    retrieval: hybridrr
    architecture: flat
  - name: para-bge-bm25-linkexp
    chunker: para
    retrieval: bm25
    architecture: linkexp
